[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "Upload a shapefile or KML file and measure its features in metres."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*testclient is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
